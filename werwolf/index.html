<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Werewolf Companion by töricht</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Werewolf">
<!-- töricht Adobe-Fonts-Kit (wie auf toericht.eu). Nicht blockierend geladen: ohne Netz greift sofort die Fallback-Schrift. -->
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/trh0ssw.css" media="print" onload="this.media='all'" onerror="this.media='all'">
<style>
:root{
  --black:#000;--white:#fff;--acid:#f6ff96;--lilac:#a98bff;--red:#ff4b35;
  --line:rgba(255,255,255,.16);--muted:rgba(255,255,255,.62);--card:#0d0d0d;
  --text:"neue-haas-grotesk-text",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font:"bd-supper",ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--black);color:var(--white);font-family:var(--font);overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.32;cursor:default}
:focus-visible{outline:2px solid var(--acid);outline-offset:3px;border-radius:4px}
::selection{background:var(--red);color:var(--black)}
html,body{font-synthesis:none;font-family:var(--text)}
/* bd-supper: Knöpfe, Pills, Rollennamen, kurze Beschriftungen. Sätze (Hinweise, Infos, Beschreibungen) bleiben in Neue Haas. */
button,.pill,.nm,.phase,.lab,.sec,.sum,.vrow b,.big-result b,.sheet h3,.hd .info,.wm,.by,.tag-title,.subhead,#ncount,.mapwrap svg text,.mini svg text{font-family:var(--font)}
.mapwrap svg text.nt{font-family:var(--text)}
.wobble{font-family:"seismic-latin-variable",var(--font);font-variation-settings:"SEIS" 100,"wght" 700}
.lc{text-transform:lowercase}

/* ---------- setup screens ---------- */
.setup{min-height:100dvh;max-width:560px;margin:0 auto;padding:22px 20px 28px;display:flex;flex-direction:column;gap:18px}
.setup.center{justify-content:center}
.brand{text-align:center;margin:10px 0 26px}
.wm{font-weight:800;font-size:clamp(46px,13vw,76px);line-height:.9;letter-spacing:-.055em;text-transform:lowercase}
.by{display:inline-block;margin-top:14px;color:var(--acid);font-weight:800;font-size:22px;transform:rotate(-6deg);text-transform:lowercase}
.stack{display:flex;flex-direction:column;gap:18px}
.big-btn{padding:26px 20px;border:3px solid var(--acid);border-radius:999px;color:var(--acid);font-weight:800;font-size:26px;letter-spacing:.08em;transition:background .15s,color .15s}

.big-btn:hover,.big-btn:active{background:var(--acid);color:var(--black)}
.primary{padding:16px 30px;border-radius:999px;background:var(--acid);color:var(--black);font-weight:800;font-size:19px;text-transform:lowercase;transition:background .15s}
.primary:hover{background:var(--lilac)}
.primary.wide{width:100%}
.ghost{padding:10px 14px;border-radius:999px;color:var(--white);font-weight:700;font-size:15px;text-transform:lowercase}
.ghost:hover{color:var(--acid)}
.outline{padding:12px 22px;border:2px solid var(--acid);color:var(--acid);border-radius:999px;font-weight:800;text-transform:lowercase}
.danger{padding:12px 22px;border:2px solid var(--red);color:var(--red);border-radius:999px;font-weight:800;text-transform:lowercase}
.top-row{display:flex;justify-content:space-between;align-items:center;margin:-6px -8px 0}
.tag-title{margin:8px 0 0;color:var(--acid);font-weight:800;font-size:clamp(30px,8vw,44px);line-height:1;transform:rotate(-3deg);transform-origin:left;text-transform:lowercase;letter-spacing:-.02em}
.muted{color:var(--muted);margin:0;font-size:16px;line-height:1.4}
.counter{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:8px}
.round{width:64px;height:64px;border-radius:50%;border:3px solid var(--acid);color:var(--acid);font-size:34px;font-weight:800;line-height:1}
.round:active{background:var(--acid);color:var(--black)}
#ncount{box-sizing:content-box;width:2.4ch;min-width:120px;height:1.2em;padding:6px 4px;margin:0;background:none;border:0;border-bottom:2px solid var(--line);border-radius:0;color:var(--white);font-family:var(--text);font-weight:800;font-size:72px;line-height:1.2;text-align:center;font-variant-numeric:tabular-nums;overflow:visible;-webkit-appearance:none;appearance:none;-moz-appearance:textfield}
#ncount::-webkit-outer-spin-button,#ncount::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mini{display:flex;justify-content:center;flex:1;min-height:150px;align-items:center}
.mini svg{width:min(62vw,240px);height:auto}
.sum{position:sticky;top:0;z-index:3;background:var(--black);padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 14px;font-weight:800;font-size:15px;text-transform:lowercase}
.sum .a{color:var(--acid)}.sum .bad{color:var(--red)}
.rlist{display:grid;gap:12px}
@media(min-width:620px){.setup.wide{max-width:900px}.rlist{grid-template-columns:1fr 1fr}}
.rcard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:22px;background:var(--card);transition:opacity .15s,border-color .15s}
.rcard.on{border-color:var(--acid)}
.rcard.off{opacity:.42;filter:grayscale(1)}
.rcard.info{border-style:dashed;cursor:default}
.ri{display:inline-block;width:1.15em;height:1.15em;object-fit:contain;vertical-align:middle;-webkit-user-drag:none;user-select:none}
.rcard .ic{font-size:34px;flex:none;width:44px;text-align:center}
.rcard .tx{flex:1;min-width:0}
.rcard .nm{font-weight:800;font-size:19px;text-transform:lowercase}
.rcard.on .nm{color:var(--acid)}
.rcard .ds{font-size:14px;color:var(--muted);line-height:1.35;margin-top:3px}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--acid);display:grid;place-items:center;color:var(--black);font-weight:900}
.rcard.on .check{background:var(--acid)}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:38px;height:38px;border-radius:50%;border:2px solid var(--acid);color:var(--acid);font-size:22px;font-weight:800;line-height:1}
.qty b{min-width:24px;text-align:center;font-size:22px;color:var(--acid)}
.subhead{margin:14px 0 0;color:var(--lilac);font-weight:800;text-transform:lowercase;font-size:16px}

/* ---------- game ---------- */
.game{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"hd" "map" "pn"}
.hd{grid-area:hd;display:flex;align-items:center;gap:6px;padding:4px 10px 3px;border-bottom:1px solid var(--line)}
.hd .info{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--muted);text-transform:lowercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .info.ok{color:var(--white)}
.phase{padding:3px 10px;border:2px solid var(--white);border-radius:999px;color:var(--white);font-weight:800;font-size:14px;text-transform:lowercase;white-space:nowrap;transform:rotate(-3deg)}
.phase.day{background:var(--white);border-color:var(--white);color:var(--black)}
.phasebar{display:inline-flex;align-items:center;gap:8px;margin:0 0 12px;padding:6px 16px;border:2px solid var(--white);border-radius:999px;font-family:var(--font);font-weight:800;font-size:22px;text-transform:lowercase;color:var(--white)}
.cmsg{margin:0;font-family:var(--text);font-weight:700;font-size:19px;line-height:1.35;white-space:pre-line}
.phasebar.day{background:var(--white);color:var(--black)}
.mapwrap.drag svg{touch-action:none}.mapwrap.drag .seat{cursor:grab}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.ibtn svg{width:20px;height:20px}
.ibtn.on{border:2px solid var(--line);color:var(--white)}
.ibtn.off{border:2px dashed var(--line);color:var(--muted)}
.mapwrap{grid-area:map;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px}
.mapwrap svg{width:100%;height:100%;max-width:820px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.seat{cursor:pointer}
.seat:focus{outline:none}
.seat:focus-visible .base{stroke:var(--acid);stroke-width:3}
.pn{grid-area:pn;border-top:1px solid var(--line);background:var(--black);max-height:50dvh;display:flex;flex-direction:column}
.pn-scroll{overflow:auto;padding:2px 14px 4px;display:flex;flex-direction:column;gap:8px}
.pn-toggle{display:flex;justify-content:center;align-items:center;width:100%;height:24px;flex:none}
.pn-toggle span{width:46px;height:5px;border-radius:9px;background:rgba(255,255,255,.35);transition:background .15s}
.pn-toggle:hover span{background:var(--acid)}
.pn-mini{display:flex;align-items:center;gap:10px;padding:0 16px 2px;cursor:pointer;min-width:0}
.pn-mini .ann{flex:1;min-width:0;gap:8px}
.pn-mini .ai{font-size:24px}
.pn-mini h2{font-size:18px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-mini .say small,.pn-mini .say .q2{display:none}
.pn-mini .say q{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-mini .mt{flex:none;padding:5px 11px;border-radius:999px;background:var(--acid);color:var(--black);font-weight:800;font-size:13px;text-transform:lowercase;max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ann{display:flex;align-items:center;gap:12px}
.ann .ai{font-size:34px;flex:none}
.ann h2{margin:0;font-family:var(--text);font-weight:700;font-size:22px;line-height:1.2;letter-spacing:-.01em}
/* Was die Spielleitung laut sagt */
.say{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.say small,.sleep small{font-family:var(--text);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.say q{display:block;quotes:none;font-family:var(--text);font-weight:700;font-size:21px;line-height:1.25;color:var(--white)}
.say q.q2{font-size:17px;font-weight:400;color:rgba(255,255,255,.88)}
.ann.dead .say q:first-of-type{color:rgba(255,255,255,.88)}
.ann.dead .ai{position:relative;opacity:.45}
.ann.dead .ai::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:4px;background:var(--red);transform:rotate(-35deg)}
.stat{font-size:15px;font-weight:700;text-transform:lowercase}
.stat .d{color:var(--red)}.stat .l{color:var(--white)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:2px solid var(--line);font-size:14px;font-weight:700;text-transform:lowercase}
.pill.ok{border-color:var(--acid);color:var(--acid)}
.pill.used{color:var(--muted);text-decoration:line-through}
.potions{display:flex;gap:10px}
.pot{flex:1;min-height:58px;padding:10px 8px;border:2px solid var(--line);border-radius:18px;font-size:17px;font-weight:700;text-transform:lowercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pot.on{background:var(--acid);border-color:var(--acid);color:var(--black)}
.pot.used span{text-decoration:line-through}
.pot small{font-family:var(--text);font-size:12px;font-weight:400;color:var(--muted)}
/* Farbregel: Gelb = jetzt tun / ausgewählt · Rot = Tod · sonst Weiß/Grau */
.alert{padding:10px 14px;border-radius:16px;border:1px solid var(--line);background:#111;color:var(--white);font-size:15px;line-height:1.35;font-weight:400}
.alert.death{border:2px solid var(--red)}
.big-result{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:20px;border:1px solid var(--line);background:#111}
.big-result .bi{font-size:40px}
.big-result b{font-size:24px;color:var(--white);text-transform:lowercase}
.chips{display:flex;flex-wrap:wrap;gap:8px 10px;padding-top:2px}
.chip{padding:9px 16px;border:2px solid var(--line);border-radius:999px;color:var(--white);font-weight:800;font-size:14px;text-transform:lowercase;transition:background .15s,color .15s}
.chip:nth-child(4n+1){transform:rotate(-2deg)}.chip:nth-child(4n+2){transform:rotate(1.5deg)}.chip:nth-child(4n+3){transform:rotate(-1deg);border-radius:999px 999px 999px 6px}.chip:nth-child(4n+4){transform:rotate(2deg)}
.chip.on{background:var(--acid);border-color:var(--acid);color:var(--black)}
.hint{font-size:14px;color:var(--muted);line-height:1.35}
.sleep{font-family:var(--text);font-size:16px;font-weight:700;color:var(--white);display:flex;align-items:baseline;gap:8px}
.undo.backic{font-size:28px;font-weight:800;line-height:1}
.cue{padding:6px 14px 0;border-top:1px solid var(--line)}
.cue+.nav{border-top:0;padding-top:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.vlist{display:flex;flex-direction:column;gap:8px}
.vrow{display:flex;gap:12px;align-items:center;padding:10px 14px;border:2px solid var(--red);border-radius:18px}
.vrow .vi{font-size:30px;flex:none}
.vrow .vt{flex:1;min-width:0}
.vrow b{display:block;font-size:20px;line-height:1.15;text-transform:lowercase}
.vrow .vn{display:block;font-size:14px;font-weight:700;color:rgba(255,255,255,.75)}
.vrow small{flex:none;max-width:38%;text-align:right;color:var(--muted);font-size:12px;line-height:1.25;text-transform:lowercase}
.sec{font-size:13px;font-weight:800;color:var(--muted);text-transform:lowercase}
.nav{display:flex;gap:8px;align-items:center;padding:6px 12px 8px;border-top:1px solid var(--line)}
.nav .sp{flex:1}
.undo{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);color:var(--white);display:grid;place-items:center;flex:none}
.undo svg{width:24px;height:24px}
.back{padding:14px 18px;border-radius:999px;border:2px solid var(--line);font-weight:800;text-transform:lowercase}
.nextb{padding:10px 22px;border-radius:999px;background:var(--acid);color:var(--black);font-weight:800;font-size:18px;text-transform:lowercase;min-width:132px}
.nextb.red{background:var(--red)}
.nextb.wait{background:none;color:var(--white);box-shadow:inset 0 0 0 2px var(--line)}
@media (min-width:600px) and (orientation:landscape){
  .game{grid-template-columns:minmax(0,1fr) min(430px,48vw);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"hd hd" "map pn"}
  .pn{max-height:none;border-top:0;border-left:1px solid var(--line)}
  .pn-scroll{flex:1}
}

/* ---------- layer: sheet / confirm / toast ---------- */
.layer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88dvh;overflow:auto;background:#0b0b0b;border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:22px;font-weight:800;text-transform:lowercase;letter-spacing:-.02em}
.sheet .lab{font-size:13px;font-weight:800;color:var(--muted);text-transform:lowercase;margin-bottom:6px}
.sheet .phead{display:flex;align-items:center;gap:14px}
.sheet .phead .bi{font-size:46px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.rbtn{padding:8px 4px;border:2px solid var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;text-transform:lowercase}
.rbtn span{font-size:24px}
.rbtn.on{border-color:var(--acid);color:var(--acid)}
.rbtn.full{opacity:.32}
.rbtn.full small{display:block;font-size:10px;font-weight:700}
.note{width:100%;padding:13px 16px;border-radius:16px;border:2px solid var(--line);background:#000;color:var(--white);font:inherit;font-size:17px}
.note:focus{border-color:var(--acid);outline:none}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:14px;font-size:14px}
.hrow span{flex:1}
.hrow button{color:var(--white);text-decoration:underline;font-weight:800;font-size:13px;text-transform:lowercase}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border:2px solid var(--acid);border-radius:999px;color:var(--acid);font-weight:800}
.seg button.on{background:var(--acid);color:var(--black)}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;max-width:min(92vw,480px);padding:12px 18px;border-radius:18px;background:var(--white);color:var(--black);font-weight:700;font-size:15px;line-height:1.3;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ================= data ================= */
const KEY='wwc-toericht-v1';
const ROLES={
  villager:{i:'🏠',en:'Villager',de:'Dorfbewohner',
    den:'No special ability.',dde:'Keine Spezialfähigkeit.'},
  werewolf:{i:'🐺',en:'Werewolf',de:'Werwolf',pen:'Werewolves',pde:'Werwölfe',
    den:'Picks a victim with the pack each night.',dde:'Wählt nachts mit dem Rudel ein Opfer.'},
  angel:{i:'😇',en:'Angel',de:'Engel',
    den:'Wins if killed in the first night or first vote.',dde:'Gewinnt, wenn er in der ersten Nacht oder Abstimmung stirbt.'},
  cupid:{i:'💘',en:'Cupid',de:'Amor',
    den:'Makes two players fall in love.',dde:'Verliebt in der ersten Nacht zwei Personen.'},
  lovers:{i:'❤️',en:'Lovers',de:'Liebende',
    den:'If one dies, so does the other.',dde:'Stirbt eine*r, stirbt auch die andere Person.'},
  hunter:{i:'🏹',en:'Hunter',de:'Jäger',
    den:'Takes someone down when dying.',dde:'Nimmt beim Sterben jemanden mit.'},
  fox:{i:'🦊',en:'Fox',de:'Fuchs',
    den:'Sniffs three seats. No Werewolf = gift lost.',dde:'Schnüffelt an drei Plätzen. Kein Werwolf = Gabe weg.'},
  wildchild:{i:'🧒',en:'Wild Child',de:'Wildes Kind',
    den:'Becomes a Werewolf if the role model dies.',dde:'Wird Werwolf, wenn das Vorbild stirbt.'},
  witch:{i:'🧙',en:'Witch',de:'Hexe',
    den:'One healing and one poison potion, once each.',dde:'Ein Heil- und ein Gifttrank, je einmal.'},
  seer:{i:'🔮',en:'Seer',de:'Seherin',
    den:'Each night sees if one player is good or a Werewolf.',dde:'Sieht jede Nacht, ob eine Person gut oder Werwolf ist.'},
  sisters:{i:'👭',en:'Sister',de:'Schwester',pen:'Two Sisters',pde:'Zwei Schwestern',
    den:'Two cards. Villagers who know each other from the first night.',dde:'Zwei Karten. Dorfbewohnerinnen, die sich ab der ersten Nacht kennen.'},
  slut:{i:'💋',en:'Slut',de:'Dirne',
    den:'Visits someone at night. Dies too if the Werewolves attack her host.',dde:'Besucht nachts jemanden. Stirbt mit, wenn die Werwölfe den Gastgeber angreifen.'},
  mayor:{i:'👑',en:'Mayor',de:'Bürgermeister',
    den:'Elected by the village. Vote counts double.',dde:'Vom Dorf gewählt. Stimme zählt doppelt.'}
};
/* gezeichnete Rollen-Icons (werwolf/icons). Ohne Icon (z. B. Liebende) bleibt das Emoji. */
const ICON={villager:1,werewolf:1,angel:1,cupid:1,hunter:1,fox:1,wildchild:1,witch:1,seer:1,slut:1,sisters:1,mayor:1};
const iconSrc=r=>ICON[r]?'icons/'+r+'.png':'';
function ico(r){return ICON[r]?`<img class="ri ri-${r}" src="${iconSrc(r)}" alt="" draggable="false">`:(ROLES[r]?ROLES[r].i:'')}
// Icon im SVG der Karte (cx/cy = Mitte, sz = Kantenlänge)
function svgIco(r,cx,cy,sz,fallbackFs){
  if(!ICON[r])return `<text x="${cx}" y="${cy}" font-size="${fallbackFs||sz}" text-anchor="middle" dominant-baseline="central">${ROLES[r]?ROLES[r].i:r}</text>`;
  return `<image href="${iconSrc(r)}" x="${(cx-sz/2).toFixed(1)}" y="${(cy-sz/2).toFixed(1)}" width="${sz.toFixed(1)}" height="${sz.toFixed(1)}" preserveAspectRatio="xMidYMid meet"/>`;
}
const SETUP_ROLES=['werewolf','seer','witch','cupid','hunter','fox','wildchild','angel','slut','sisters'];

/* ================= state ================= */
let S, H=[], storageOK=true;
const ui={sheet:null,confirm:null,settings:false,lp:false,peek:false,drag:false};
function blank(){return preset({v:1,screen:'lang',lang:'de',n:12,counts:{werewolf:2,seer:1,witch:1},game:null,reveal:true})}
/* Vorauswahl nach Spielerzahl (danach frei änderbar):
   8–11: 2 Werwölfe, kein Fuchs, kein Engel · 12–15: 3 Werwölfe, kein Fuchs · ab 16: 4 Werwölfe */
function preset(s){
  const n=s.n,c=s.counts;if(n<8)return s;
  c.werewolf=n<=11?2:n<=15?3:4;
  if(n<=15)c.fox=0;
  if(n<=11)c.angel=0;
  return s}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const o=JSON.parse(raw);S=o.S;H=o.H||[];if(S&&S.game)S.screen='resume';else if(S)S.screen='lang';}
  }catch(e){storageOK=false}
  if(!S||!S.counts)S=blank();
}
function save(){
  // Sitzordnung/Merkmale fürs nächste Spiel am selben Tag merken
  if(S.game)S.lastSeats={day:new Date().toDateString(),n:S.game.p.length,seats:S.game.p.map(p=>({anchor:p.anchor,note:p.note})),pos:S.game.seatPos||null};
  try{if(H.length>80)H=H.slice(-80);localStorage.setItem(KEY,JSON.stringify({S,H}))}
  catch(e){if(storageOK){storageOK=false;toast(t('noStorage'))}}
}
function t(k,v){const e=T[k];let s=e?(S.lang==='en'?e[0]:e[1]):k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s}
function rn(r,plural){const R=ROLES[r];if(!R)return r;if(plural&&R.pen)return S.lang==='en'?R.pen:R.pde;return S.lang==='en'?R.en:R.de}
function rd(r){const R=ROLES[r];return S.lang==='en'?R.den:R.dde}
function wake(r,sleep){const w=WAKE[r];return S.lang==='en'?w[sleep?2:0]:w[sleep?3:1]}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function G(){return S.game}

function newGame(keepSeats,keepPos){
  const n=S.n;let carried=!!(keepPos&&keepPos.length===n);
  const p=Array.from({length:n},(_,i)=>{
    const old=keepSeats&&keepSeats[i];
    if(keepSeats)carried=carried||!!(old&&old.note);
    return {role:'villager',orig:null,dead:false,cause:null,anchor:old?old.anchor:false,note:old?old.note:'',mayor:false};
  });
  S.game={p,lovers:[],model:null,wild:false,witch:{heal:true,poison:true},fox:true,visit:null,
    night:1,phase:'night',step:0,nd:blankNight(),cond:null,queue:[],tap:null,angelWon:false};
  if(keepPos&&keepPos.length===n)S.game.seatPos=keepPos;
  S.game.carried=carried;
  enterStep();
}
function blankNight(){return {wolf:null,heal:false,poison:null,seer:null,fox:null}}

/* commit: snapshot for undo, apply, save, render */
function commit(label,fn){
  const snap=JSON.stringify(S.game);
  H.push({l:label,t:Date.now(),s:snap});
  fn();
  normalize();
  save();render();
}
function normalize(){
  const g=G();if(!g)return;
  g.queue=g.queue.filter(q=>!(q.k==='lover'&&g.p[q.i].dead));
}
function undo(){
  if(!H.length){toast(t('nothingUndo'));return}
  const h=H.pop();S.game=JSON.parse(h.s);ui.peek=false;save();render();toast(t('undone',{a:h.l}));
}
function undoTo(idx){
  if(idx<0||idx>=H.length)return;
  const h=H[idx];S.game=JSON.parse(h.s);H=H.slice(0,idx);ui.peek=false;save();render();toast(t('undone',{a:h.l}));
}

/* ================= game helpers ================= */
const act=r=>(S.counts[r]||0)>0;
function steps(){const g=G();
  // Tote Rollen behalten ihre Runde: Die Spielleitung ruft sie trotzdem auf, damit niemand merkt, dass sie tot sind.
  const base=(g.night===1?FIRST:LATER).filter(r=>r==='lovers'?act('cupid'):act(r));
  return [...(g.night===1?['anchors','dusk']:['dusk']),...base];
}
function curStep(){const s=steps();return s[Math.min(G().step,s.length-1)]}
function isWolf(i){const g=G(),p=g.p[i];return p.role==='werewolf'||(p.role==='wildchild'&&g.wild)}
function holders(r){const g=G();
  if(r==='lovers')return g.lovers.slice();
  if(r==='werewolf')return g.p.map((_,i)=>i).filter(isWolf);
  return g.p.map((p,i)=>p.role===r?i:-1).filter(i=>i>=0);
}
function assignedCount(r){return G().p.filter(p=>p.role===r).length}
/* Sind alle Karten dieser Rolle schon vergeben? (Dorfbewohner sind unbegrenzt; ein Engel, der zum Dorfbewohner wurde, zählt weiter als Engel-Karte) */
function roleFull(r){if(r==='villager')return false;return G().p.filter(p=>p.role===r||p.orig===r).length>=(S.counts[r]||0)}
function roleAlive(r){const h=holders(r);return h.length===0||h.some(i=>!G().p[i].dead)}
function roleDead(r){const h=holders(r);return h.length>0&&h.every(i=>G().p[i].dead)}
function slutIdx(){return G().p.findIndex(p=>p.role==='slut'&&!p.dead)}
function slutAway(){const g=G(),s=slutIdx();return s>=0&&g.visit!=null&&g.visit!==s}
// Schwestern wissen selbst voneinander – die Spielleitung muss sie nicht zuweisen
const NO_ASSIGN=['sisters'];
function openRoles(){let c=0;for(const r of SETUP_ROLES.filter(r=>!NO_ASSIGN.includes(r)))c+=Math.max(0,(S.counts[r]||0)-assignedCount(r));return c}
// lebende Nachbarn links/rechts (Sitzreihenfolge)
function foxGroup(c){const g=G(),n=g.p.length;
  const nb=d=>{let j=c;for(let k=1;k<n;k++){j=(j+d+n)%n;if(!g.p[j].dead)return j}return c};
  return [...new Set([nb(-1),c,nb(1)])]}
// die drei gewählten Plätze (alte Spielstände: nur Mitte gespeichert)
function foxArr(){const f=G().nd.fox;return Array.isArray(f)?f:f!=null?foxGroup(f):[]}
function foxNeed(){return Math.min(3,G().p.filter(p=>!p.dead).length)}
function foxHit(a){return (a||foxArr()).some(i=>!G().p[i].dead&&isWolf(i))}
function plabel(i){
  const g=G(),p=g.p[i];
  const note=p.note?'📌 '+p.note:'';
  if(!S.reveal&&!ui.sheet)return note||t('marked');
  return rn(p.role)+(note?' · '+note:'');
}
function modes(st){
  const n1=G().night===1;
  const m={anchors:['anchor'],dusk:[],angel:['as:angel'],sisters:[],cupid:n1?['as:cupid','lovers']:[],lovers:['lovers'],
    wildchild:['as:wildchild','model'],slut:n1?['as:slut','visit']:['visit'],werewolf:n1?['as:werewolf','wolf']:['wolf'],
    seer:n1?['as:seer']:[],fox:n1?['as:fox','fox']:['fox'],witch:n1?['as:witch','poison']:['poison'],resolve:[]}[st]||[];
  return st==='anchors'?m:[...m,'edit'];
}
function enabled(m){
  const g=G();
  if(m==='edit'||m==='anchor'||m.startsWith('as:')||m==='lovers'||m==='cond'||m==='mayor'||m==='hunter')return true;
  if(m==='model')return roleAlive('wildchild');
  if(m==='visit')return roleAlive('slut');
  if(m==='wolf')return roleAlive('werewolf');
  if(m==='seer')return roleAlive('seer');
  if(m==='fox')return roleAlive('fox')&&g.fox;
  if(m==='poison')return roleAlive('witch')&&g.witch.poison;
  return false;
}
function defaultMode(){
  const st=curStep(),ms=modes(st);
  for(const m of ms)if(m.startsWith('as:')&&assignedCount(m.slice(3))<S.counts[m.slice(3)])return m;
  for(const m of ms)if(!m.startsWith('as:')&&m!=='edit'&&m!=='poison'&&enabled(m))return m;
  return st==='anchors'?'anchor':'edit';
}
function enterStep(){const g=G();g.tap=defaultMode();ui.peek=false}
/* Vor der Abstimmung braucht das Dorf einen lebenden Bürgermeister (überspringbar pro Tag) */
function inMorning(){const g=G();return g.phase==='day'&&Array.isArray(g.today)&&g.morningDone!==g.night}
function needMayor(){const g=G();return g.phase==='day'&&!g.p.some(p=>p.mayor&&!p.dead)&&g.mayorSkip!==g.night&&!(g.today||[]).some(i=>g.p[i].cause==='vote')}
function curMode(){
  const g=G();
  if(g.queue.length){const q=g.queue[0];return q.k==='hunter'?'hunter':q.k==='mayor'?'mayor':'edit'}
  if(g.phase==='day')return inMorning()?'edit':needMayor()||g.tap==='mayor'?'mayor':'cond';
  return g.tap||'edit';
}

/* death + consequences */
function kill(i,cause){
  const g=G(),p=g.p[i];if(p.dead)return;
  p.dead=true;p.cause=cause;
  if(Array.isArray(G().today))G().today.push(i);
  if(g.lovers.length===2&&g.lovers.includes(i)){const o=g.lovers.find(x=>x!==i);if(!g.p[o].dead)g.queue.push({k:'lover',i:o})}
  if(p.role==='hunter')g.queue.push({k:'hunter',i,target:null});
  if(g.model===i&&!g.wild){const w=g.p.findIndex(x=>x.role==='wildchild'&&!x.dead);if(w>=0){g.wild=true;g.queue.push({k:'info',m:'qWild'})}}
  if(p.mayor){p.mayor=false;p.wasMayor=true} // Neuwahl erst am Anfang des nächsten Tages
  if(p.role==='angel'&&g.night===1&&(g.phase==='night'||cause==='vote')){g.angelWon=true;g.queue.push({k:'info',m:'qAngel'})}
}
function computeNight(){
  const g=G(),nd=g.nd,s=slutIdx(),away=slutAway(),V=g.visit;
  const deaths=new Map(),notes=[];
  const add=(i,c)=>{if(i==null||g.p[i].dead)return;if(!deaths.has(i))deaths.set(i,[]);if(!deaths.get(i).includes(c))deaths.get(i).push(c)};
  if(nd.wolf!=null){
    if(away&&nd.wolf===s){notes.push(['n_slutHomeEmpty']);if(nd.heal)notes.push(['n_healWasted'])}
    else{
      if(nd.heal)notes.push(['n_healed',plabel(nd.wolf)]);else add(nd.wolf,'wolf');
      if(away&&nd.wolf===V){add(s,'slutVisit');if(nd.heal)notes.push(['n_slutStill'])}
    }
  }
  if(nd.poison!=null){
    if(away&&nd.poison===s)notes.push(['n_poisonWasted']);
    else add(nd.poison,'poison'); // Regel: vergiftet die Hexe den Gastgeber, überlebt die Dirne
  }
  return {deaths:[...deaths.entries()].map(([i,c])=>({i,c})),notes};
}

/* ================= actions ================= */
function tapPlayer(i){
  const g=G(),p=g.p[i],m=curMode();
  if(m==='edit')return openSheet(i);
  if(!enabled(m))return toast(t('noAction'));
  if(m==='anchor'){
    return openSheet(i,true);
  }
  if(m.startsWith('as:')){
    const r=m.slice(3);
    if(p.role===r){commit(t('L_assign',{a:rn(r),b:'−'}),()=>{p.role='villager'});return}
    if(assignedCount(r)>=S.counts[r])return toast(t('quotaFull',{a:rn(r)}));
    const prev=p.role;
    commit(t('L_assign',{a:rn(r),b:'+'}),()=>{
      p.role=r;
      if(assignedCount(r)>=S.counts[r]){const nx=modes(curStep()).find(x=>!x.startsWith('as:')&&x!=='edit'&&x!=='poison');if(nx)g.tap=nx;else g.tap='edit'}
    });
    if(prev!=='villager')toast(t('replaced',{a:rn(prev),b:rn(r)}));
    return;
  }
  const needAlive=['lovers','visit','wolf','seer','poison','cond','mayor','hunter','model'];
  if(needAlive.includes(m)&&p.dead)return toast(t('isDead'));
  switch(m){
    case 'lovers':
      if(g.lovers.includes(i))return commit(t('L_lover'),()=>{g.lovers=g.lovers.filter(x=>x!==i)});
      if(g.lovers.length>=2)return toast(t('alreadyTwo'));
      return commit(t('L_lover'),()=>{g.lovers.push(i)});
    case 'model':
      if(p.role==='wildchild')return toast(t('notSelf'));
      return commit(t('L_model'),()=>{g.model=g.model===i?null:i});
    case 'visit':{
      const s=slutIdx();if(s<0)return toast(t('assignFirst'));
      return commit(t('L_visit'),()=>{g.visit=(i===s||g.visit===i)?null:i});}
    case 'wolf':
      return commit(t('L_wolf'),()=>{g.nd.wolf=g.nd.wolf===i?null:i;g.nd.heal=false});
    case 'seer':
      ui.peek=false;return commit(t('L_seer'),()=>{g.nd.seer=g.nd.seer===i?null:i});
    case 'fox':
      return commit(t('L_fox'),()=>{
        const a=foxArr();
        // erster Tipp (oder Tipp außerhalb einer vollen Auswahl): Platz + Nachbarn; sonst einzelnen Platz an/aus
        if(!a.length||(a.length>=foxNeed()&&!a.includes(i)))g.nd.fox=foxGroup(i);
        else if(a.includes(i)){const b=a.filter(x=>x!==i);g.nd.fox=b.length?b:null}
        else g.nd.fox=[...a,i];
      });
    case 'poison':
      if(!g.witch.poison)return toast(t('poisonUsed'));
      return commit(t('L_poison'),()=>{g.nd.poison=g.nd.poison===i?null:i});
    case 'cond':
      return commit(t('L_pick'),()=>{g.cond=g.cond===i?null:i});
    case 'mayor':
      return commit(t('L_mayor'),()=>{
        const was=p.mayor;g.p.forEach(x=>x.mayor=false);p.mayor=!was;
        if(g.queue.length&&g.queue[0].k==='mayor'&&p.mayor)g.queue.shift();
      });
    case 'hunter':{
      const q=g.queue[0];if(i===q.i)return toast(t('notSelf'));
      return commit(t('L_pick'),()=>{q.target=q.target===i?null:i});}
  }
}
/* Was in dieser Runde vergessen sein könnte (Warnung vor dem Weiterklicken, kein Verbot) */
function missing(){
  const g=G(),miss=[];
  if(g.phase==='day'){if(!(g.today||[]).some(i=>g.p[i].cause==='vote')&&!inMorning())miss.push(t('missVote'));return miss}
  const st=curStep(),nd=g.nd;
  if(!WAKE[st]||roleDead(st))return miss;
  const need=S.counts[st]||0;
  if(g.night===1&&need&&!NO_ASSIGN.includes(st)&&assignedCount(st)<need)miss.push(t('missAssign',{a:rn(st,need>1)}));
  if(st==='werewolf'&&nd.wolf==null)miss.push(t('missWolf'));
  if(st==='slut'&&g.visit==null)miss.push(t('missVisit'));
  if(st==='fox'&&g.fox&&foxArr().length<foxNeed())miss.push(t('missFox'));
  if(st==='cupid'&&g.lovers.length<2)miss.push(t('missLovers'));
  if(st==='wildchild'&&g.model==null)miss.push(t('missModel'));
  return miss;
}
function guard(fn){const m=missing();if(!m.length)return fn();askConfirm(m.join('\n'),t('goAnyway'),fn)}
function goNext(){
  const g=G(),st=steps();
  if(g.step<st.length-1){g.step++;enterStep();save();render();scrollPanelTop()}
}
function goBack(){
  const g=G();
  if(g.step>0){g.step--;enterStep();save();render();scrollPanelTop()}
}
function resolveNight(){
  commit(t('L_resolve'),()=>{
    const g=G(),r=computeNight(),nd=g.nd;
    if(nd.heal)g.witch.heal=false;
    if(nd.poison!=null)g.witch.poison=false;
    if(foxArr().length&&g.fox&&!foxHit()){g.fox=false}
    g.today=[];g.nightNotes=r.notes;
    r.deaths.forEach(d=>kill(d.i,d.c[0]));
    g.phase='day';g.cond=null;g.tap='cond';
  });
  scrollPanelTop();
}
function nextNight(){
  commit(t('L_night'),()=>{
    const g=G();
    if(g.night===1){g.p.forEach(p=>{if(p.role==='angel'&&!p.dead){p.orig='angel';p.role='villager'/* still: weiß nur die Person selbst */}})}
    g.today=null;
    g.night++;g.phase='night';g.step=0;g.nd=blankNight();g.visit=null;g.cond=null;
    enterStep();
  });
  scrollPanelTop();
}
function condemn(){
  const g=G();if(g.cond==null)return;
  commit(t('L_cond'),()=>{const i=g.cond;g.cond=null;kill(i,'vote')});
}
function qAction(kind){
  const g=G(),q=g.queue[0];if(!q)return;
  if(kind==='ok')return commit(t('L_q'),()=>{g.queue.shift()});
  if(kind==='loverDie')return commit(t('L_dead'),()=>{g.queue.shift();kill(q.i,'heartbreak')});
  if(kind==='shoot'){if(q.target==null)return;return commit(t('L_shot'),()=>{g.queue.shift();kill(q.target,'hunter')})}
}

/* ---------- map ---------- */
/* Sitze liegen gleichmäßig (nach Bogenlänge) auf einem Oval, das die freie Fläche ausfüllt.
   Einheiten: die kürzere Seite der Fläche = 420, damit Schrift- und Badge-Größen wie bisher bleiben. */
function ellipsePts(cx,cy,ax,by,n){
  const N=720,L=[0];let px=cx,py=cy-by,acc=0;
  for(let j=1;j<=N;j++){const t=-Math.PI/2+2*Math.PI*j/N,x=cx+ax*Math.cos(t),y=cy+by*Math.sin(t);acc+=Math.hypot(x-px,y-py);L.push(acc);px=x;py=y}
  const out=[];let j=0;
  for(let i=0;i<n;i++){
    const s=acc*i/n;while(j<N-1&&L[j+1]<s)j++;
    const f=(s-L[j])/((L[j+1]-L[j])||1),t=-Math.PI/2+2*Math.PI*(j+f)/N;
    out.push([cx+ax*Math.cos(t),cy+by*Math.sin(t),t]);
  }
  return {P:acc,pts:out};
}
function mapGeom(n){
  const W=Math.max(200,ui.mw||382),H=Math.max(200,ui.mh||382),k=Math.min(W,H)/420;
  const VW=W/k,VH=H/k,cx=VW/2,cy=VH/2;
  let r=36,E;
  for(let it=0;it<6;it++){
    const pad=r*1.15+5;let ax=cx-pad,by=cy-pad;
    if(by>ax*1.6)by=ax*1.6;if(ax>by*1.6)ax=by*1.6;
    E=ellipsePts(cx,cy,ax,by,n);
    const nr=Math.max(10,Math.min(36,E.P/n/2*.94));
    if(it===5)r=Math.min(r,nr);else r=nr;
  }
  return {VW,VH,cx,cy,r,k,pts:E.pts};
}
// eigene Sitzpositionen (als Anteil der Kartenfläche gespeichert, passt sich beim Drehen an)
function seatPts(M,n){
  const sp=G().seatPos;if(!sp||sp.length!==n)return M.pts;
  const m=M.r+4;return sp.map(([u,v])=>{const x=Math.max(m,Math.min(M.VW-m,u*M.VW)),y=Math.max(m,Math.min(M.VH-m,v*M.VH));return [x,y,Math.atan2(y-M.cy,x-M.cx)]});
}
function vMap(){
  const g=G(),n=g.p.length,M=mapGeom(n),cx=M.cx,cy=M.cy,r=M.r;
  const rev=S.reveal,st=g.phase==='night'?curStep():null,m=curMode();
  const P=seatPts(M,n),pos=i=>P[i];
  const q0=g.queue[0];
  // pending deaths preview
  let pend=new Set();
  if(g.phase==='night'&&st==='resolve')computeNight().deaths.forEach(d=>pend.add(d.i));
  const holderSet=new Set();
  if(rev&&st&&WAKE[st])holders(st).forEach(i=>{if(!g.p[i].dead)holderSet.add(i)});
  const foxSet=new Set(rev&&st==='fox'?foxArr():[]);
  let lines='',seats='',notes='';
  // Verbindungslinien nur dann, wenn sie gerade gebraucht werden (Herz-/Stern-Badges bleiben immer sichtbar)

    if(p.dead){const k=r*.62;inner+=`<g stroke="#ff4b35" stroke-width="${Math.max(2.5,r*.11)}" stroke-linecap="round" opacity=".9"><line x1="${x-k}" y1="${y-k}" x2="${x+k}" y2="${y+k}"/><line x1="${x+k}" y1="${y-k}" x2="${x-k}" y2="${y+k}"/></g>`}

/* Kann das Dorf rechnerisch noch gewinnen? (nur mit offenen Rollen)
   Spielt alle Verläufe durch: Dorf stimmt bestmöglich ab, Gegner spielen bestmöglich gegen das Dorf,
   Zufall (wen die Werwölfe ohne Wissen treffen, leeres Haus der Dirne) zählt zugunsten des Dorfs.
   Regeln: Bürgermeister-Stimme zählt doppelt, bei Gleichstand entscheidet seine Seite; ohne Bürgermeister
   wird bei Gleichstand niemand verbannt/gewählt. Neuwahl am Tagesanfang. Jäger nimmt beim Tod einen Werwolf mit.
   Hexe kann heilen (auch sich selbst) und vergiften.
   Verliebte: stirbt einer, stirbt der andere mit. Werwolf + Dorfbewohner verliebt = eigenes Team (wollen als
   letzte zwei überleben): der Dorf-Teil stimmt gegen das Dorf, seine Sonderrolle hilft dem Dorf nicht,
   die Werwölfe töten ihn nachts nicht.
   Zustand: W = Werwölfe ohne Verliebte; p/h/wi/s = Dorf ohne Verliebte (normal/Jäger/Hexe/Dirne);
   L = Rollen der lebenden Verliebten ('w' = Werwolf); mayor = 'none'|'wolf'|p/h/wi/s|'L0'|'L1'. */
const CATS=['p','h','wi','s'];
function villageCanWin(start){
  const memo=new Map(),busy=new Set();let hitBusy=0;
  const mixed=s=>s.L.length===2&&s.L.includes('w')&&!s.L.every(x=>x==='w');
  const lovV=s=>s.L.length&&!s.L.includes('w')?[0,1]:[];                 // Verliebte auf Dorfseite
  const villSide=s=>s.p+s.h+s.wi+s.s+lovV(s).length;
  const wolvesAll=s=>s.W+s.L.filter(x=>x==='w').length;
  const advVotes=s=>wolvesAll(s)+(mixed(s)?1:0);
  const mSide=s=>{const m=s.mayor;if(m==='none')return '';if(m==='wolf')return 'A';
    if(m[0]==='L'){const i=+m[1];return s.L[i]==='w'||mixed(s)?'A':'V'}return 'V'};
  const has=(s,r)=>s[r]>0||lovV(s).some(i=>s.L[i]===r);                 // Fähigkeit fürs Dorf verfügbar
  const avail=(s,c)=>s[c]-(s.mayor===c?1:0)>0;
  // Paar stirbt zusammen
  const coupleDies=s0=>{const s={...s0},L=s.L;s.L=[];if(s.mayor[0]==='L')s.mayor='none';
    const vSide=!L.includes('w');
    if(vSide&&L.includes('wi')&&!s.wi){s.heal=0;s.poison=0}
    return vSide&&L.includes('h')?shoot(s):[s]};
  // ein Werwolf stirbt (Dorf wählt, welcher)
  const wolfDies=s=>{const out=[];
    if(s.W>0){const o={...s,W:s.W-1};if(s.mayor==='wolf'&&s.W===1)o.mayor='none';out.push(o);
      if(s.mayor==='wolf'&&s.W>1)out.push({...o,mayor:'none'})}
    if(s.L.includes('w'))out.push(...coupleDies(s));
    return out};
  const shoot=s=>wolvesAll(s)>0?[s,...wolfDies(s)]:[s];                   // Jäger darf schießen
  // ein Dorf-Mitglied stirbt: who = Kategorie | 'L0'/'L1'
  const villDies=(s,who,isMayor)=>{
    if(who[0]==='L')return coupleDies(s);
    const o={...s};o[who]--;if(isMayor)o.mayor='none';if(who==='wi'&&!o.wi&&!lovV(o).some(i=>o.L[i]==='wi')){o.heal=0;o.poison=0}
    return who==='h'?shoot(o):[o]};
  const victims=(s,ch)=>{
    if(ch==='mayor')return [[s.mayor,true]];
    const v=CATS.filter(c=>avail(s,c)).map(c=>[c,false]);
    lovV(s).forEach(i=>{if(s.mayor!=='L'+i)v.push(['L'+i,false])});
    return v};
  const advChoices=s=>{const c=[];if(mSide(s)==='V')c.push('mayor');if(victims(s,'anon').length)c.push('anon');return c};
  function rec(s){
    if(wolvesAll(s)<=0)return villSide(s)>0;if(villSide(s)<=0)return false;
    const k=JSON.stringify(s);if(memo.has(k))return memo.get(k);if(busy.has(k)){hitBusy++;return false}
    busy.add(k);const h0=hitBusy;let r=false;
    if(s.ph==='day'){                                        // Tagesanfang: ggf. Bürgermeisterwahl
      if(s.mayor!=='none')r=rec({...s,ph:'vote'});
      else{const v=villSide(s),w=advVotes(s);
        if(v>w)r=CATS.some(c=>s[c]>0&&rec({...s,mayor:c,ph:'vote'}))||lovV(s).some(i=>rec({...s,mayor:'L'+i,ph:'vote'}));
        else if(w>v){const o=[];if(s.W>0)o.push('wolf');s.L.forEach((x,i)=>{if(x==='w'||mixed(s))o.push('L'+i)});r=o.every(m=>rec({...s,mayor:m,ph:'vote'}))}
        else r=rec({...s,ph:'vote'});}
    }else if(s.ph==='vote'){                                 // Abstimmung
      const ms=mSide(s),vv=villSide(s)+(ms==='V'?1:0),ww=advVotes(s)+(ms==='A'?1:0),n={...s,ph:'night'};
      if(vv>ww||(vv===ww&&ms==='V'))r=wolfDies(n).some(rec)||(mixed(s)&&coupleDies(n).some(rec));
      else if(ww>vv||(vv===ww&&ms==='A'))r=advChoices(s).every(ch=>victims(s,ch).some(([c,m])=>villDies(n,c,m).some(rec)));
      else r=rec(n);
    }else{                                                   // Nacht
      const d={...s,ph:'day'},canPoison=has(s,'wi')&&s.poison,canHeal=has(s,'wi')&&s.heal,slut=has(s,'s');
      r=advChoices(s).every(ch=>{
        const outs=[];
        if(slut&&(ch==='anon'||s.mayor==='s'))outs.push(d);              // leeres Haus der Dirne
        if(canHeal)outs.push({...d,heal:0});                               // Hexe heilt
        victims(s,ch).forEach(([c,m])=>outs.push(...villDies(d,c,m)));
        const pois=o=>canPoison&&wolvesAll(o)>0?[o,...wolfDies({...o,poison:0})]:[o];
        return outs.flatMap(pois).some(rec);
      });
    }
    busy.delete(k);if(r||hitBusy===h0)memo.set(k,r);return r;
  }
  return rec(start);
}
function winNote(ph){
  const g=G();if(!S.reveal)return '';
  // Solange noch Rollen fehlen (z. B. Werwölfe in Nacht 1 noch nicht angetippt), lässt sich nichts sagen
  if(openRoles()>0)return '';
  const alive=g.p.map((_,i)=>i).filter(i=>!g.p[i].dead),W=alive.filter(isWolf).length,V=alive.length-W;
  const lov=g.lovers.length===2&&g.lovers.every(i=>!g.p[i].dead)?g.lovers:[];
  const mixedL=lov.length&&lov.some(isWolf)&&!lov.every(isWolf);
  if(mixedL&&alive.length===2)return `<div class="alert good">❤️ ${t('loversWin')}</div>`;
  if(W===0)return `<div class="alert good">🏆 ${t('wolvesAllDead')}</div>`;
  const cat=i=>{const r=g.p[i].role;return r==='hunter'?'h':r==='witch'?'wi':r==='slut'?'s':'p'};
  const st={W:0,p:0,h:0,wi:0,s:0,heal:0,poison:0,L:lov.map(i=>isWolf(i)?'w':cat(i)),mayor:'none',ph};
  alive.filter(i=>!lov.includes(i)).forEach(i=>{if(isWolf(i))st.W++;else st[cat(i)]++});
  if(alive.some(i=>g.p[i].role==='witch')){st.heal=g.witch.heal?1:0;st.poison=g.witch.poison?1:0}
  const m=alive.find(i=>g.p[i].mayor);
  if(m!=null)st.mayor=lov.includes(m)?'L'+lov.indexOf(m):isWolf(m)?'wolf':cat(m);
  if(villageCanWin(st))return '';
  return `<div class="alert death">🐺 ${t('villageLost')}<div class="hint" style="margin:4px 0 0">${t('wolfCount',{a:W,b:V})}${mixedL?' · ❤️ '+t('loversTeam'):''}</div></div>`;
}
/* Immer nur ein Satz zum Vorlesen (Platz sparen):
   Nacht 1, Rolle noch nicht angetippt -> "… wacht auf."; danach bzw. ab Nacht 2 -> der Auftrag. Tote Rolle -> nur Aufwachen. */
/* Runde mit Auswahl: ist sie getroffen? (null = Runde hat keine eigene Auswahl, z. B. Hexe, Liebende) */
function stepDone(st){
  const g=G(),nd=g.nd,need=S.counts[st]||0;
  const assigned=!(g.night===1&&need&&!NO_ASSIGN.includes(st)&&assignedCount(st)<need);
  switch(st){
    case 'werewolf':return assigned&&nd.wolf!=null;
    case 'fox':return g.fox?assigned&&foxArr().length>=foxNeed():null;
    case 'slut':return assigned&&g.visit!=null;
    case 'cupid':return assigned&&g.lovers.length===2;
    case 'wildchild':return assigned&&g.model!=null;
    case 'angel':return assigned;
    default:return null;
  }
}
function sayNow(st,dead){
  const g=G(),need=S.counts[st]||0;
  const unassigned=g.night===1&&need&&!NO_ASSIGN.includes(st)&&assignedCount(st)<need;
  if(dead||unassigned)return wake(st);
  if(stepDone(st))return wake(st,true);   // Auswahl getroffen -> einschlafen lassen
  return askLine(st)||wake(st);
}

    body+=r.notes.map(n=>`<div class="hint">${esc(t(n[0],{a:n[1]||''}))}</div>`).join('');
    resolveHasDeaths=nD>0;
    ms=[];
  }else{
    const dead=roleDead(st);
    ann=`<div class="ann ${dead?'dead':''}"><div class="ai">${ico(st)}</div>${sayBlock([sayNow(st,dead)])}</div>`;
    // Kein Status-Satz mehr ("hexe — lebt"): tot sieht man an der durchgestrichenen Ansage + Hinweis, alles andere auf der Karte.
    body='';
    // eigene Einschlafen-Zeile nur, wenn die Runde keine Auswahl hat (dann wechselt der Satz oben nicht von selbst)
    const done=dead?null:stepDone(st);
    if(done===null)sleep=`<div class="sleep"><span>${esc(qt(wake(st,true)))}</span></div>`;
    waiting=done===false;
    if(dead&&st!=='lovers'){body+=`<div class="hint">${t('deadCall')}</div>`;ms=[]}
    else switch(st){
      case 'angel':case 'sisters':break;
      case 'cupid':
        if(g.lovers.length===2)body+=`<div class="alert good">❤️ ${esc(t('loversAre',{a:plabel(g.lovers[0]),b:plabel(g.lovers[1])}))}</div>`;break;
      case 'lovers':
        body+=g.lovers.length===2?`<div class="hint">${t('loversStep')}</div><div class="alert good">❤️ ${esc(t('loversAre',{a:plabel(g.lovers[0]),b:plabel(g.lovers[1])}))}</div>`
          :`<div class="alert">${t('loversNone')}</div>`;break;
      case 'wildchild':
        if(g.model!=null)body+=`<div class="alert good">⭐ ${esc(t('modelIs',{a:plabel(g.model)}))}</div>`;break;
      case 'slut':
        body+=g.visit!=null?`<div class="alert good">💋 ${esc(t('visitIs',{a:plabel(g.visit)}))}</div>`:`<div class="hint">💋 ${t('visitHome')}</div>`;break;
      case 'werewolf':
        if(nd.wolf!=null)body+=`<div class="alert ${slutAway()&&nd.wolf===slutIdx()?'':'death'}">🐾 ${esc(t('victimIs',{a:plabel(nd.wolf)}))}</div>`;
        if(nd.wolf!=null&&slutAway()&&nd.wolf===g.visit)body+=`<div class="alert death">💋 ${t('slutHit')}</div>`;
        if(nd.wolf!=null&&slutAway()&&nd.wolf===slutIdx())body+=`<div class="alert info">💋 ${t('slutHomeEmpty')}</div>`;
        break;
      case 'fox':
        if(!g.fox){body+=`<div class="big-result"><span class="bi">🚫</span><div><b>${t('foxNoGift')}</b><div class="hint">${t('foxNoGiftHint')}</div></div></div>`;ms=[];break}
        if(foxArr().length>=foxNeed())body+=foxHit()?`<div class="big-result"><span class="bi">${ico('werewolf')}</span><b>${t('foxYes')}</b></div>`:`<div class="big-result"><span class="bi">∅</span><b>${t('foxNo')}</b></div>`;
        break;
      case 'witch':{
        // Nacht 1: erst die Hexe zuweisen (eigener Schritt), dann erst Opfer + Tränke zeigen
        if(g.night===1&&assignedCount('witch')<(S.counts.witch||0)){ms=ms.filter(m=>m.startsWith('as:'));break}
        // Zwei gleich aufgebaute Trank-Knöpfe. Heilen wirkt aufs Werwolf-Opfer; Vergiften: Knopf antippen, dann Person.
        const healAvail=g.witch.heal,poisAvail=g.witch.poison;
        const attackFails=nd.wolf!=null&&slutAway()&&nd.wolf===slutIdx();
        body+=nd.wolf!=null?`<div class="alert ${attackFails?'':'death'}">🐾 ${esc(t('witchSees',{a:plabel(nd.wolf)}))}</div>`:'';  // "Niemand wurde angegriffen" steht schon im Satz oben
        if(nd.wolf!=null&&slutAway()&&nd.wolf===g.visit)body+=`<div class="alert death">💋 ${t('slutHit')}</div>`;
        if(attackFails)body+=`<div class="hint">💋 ${t('slutHomeEmpty')}</div>`;
        const canHeal=healAvail&&nd.wolf!=null&&!attackFails;
        const healSub=!healAvail?t('used'):!canHeal?t('noVictimShort'):'';
        const pMode=curMode()==='poison',pSet=nd.poison!=null;
        body+=`<div class="potions">
          <button class="pot ${nd.heal?'on':''} ${!healAvail?'used':''}" data-a="heal" ${canHeal?'':'disabled'} aria-pressed="${nd.heal}"><span>💚 ${nd.heal?t('healOn'):t('useHeal')}</span>${healSub?`<small>${healSub}</small>`:''}</button>
          <button class="pot ${pMode||pSet?'on':''} ${!poisAvail?'used':''}" data-a="potP" ${poisAvail?'':'disabled'} aria-pressed="${pMode||pSet}"><span>☠️ ${pSet?t('poisoned'):t('doPoison')}</span>${!poisAvail?`<small>${t('used')}</small>`:''}</button>
        </div>`;
        if(pSet)body+=`<div class="alert death">☠️ ${esc(t('poisonOn',{a:plabel(nd.poison)}))}</div>`;
        else if(pMode)body+=`<div class="hint">${t('h_poison')}</div>`;
        if(pSet&&slutAway()&&nd.poison===g.visit)body+=`<div class="hint">💋 ${t('slutPoisonSafe')}</div>`;
        ms=ms.filter(m=>m.startsWith('as:'));   // Gift hat jetzt einen eigenen Knopf
        witchUI=true;
        break;}
    }
  }
  const back=`<button class="undo backic" data-a="back" ${g.step===0?'disabled':''} aria-label="${t('back')}" title="${t('back')}">‹</button>`;
  nextBtn=isLast?`<button class="nextb ${waiting?'wait':''}" data-a="resolve">☀️ ${t('startDay')}</button>`:`<button class="nextb ${waiting?'wait':''}" data-a="next">${t('next')} ›</button>`;
  // Hexe: in Nacht 1 nur der Zuweisen-Knopf; dessen Hinweis nur, solange gerade zugewiesen wird
  // Rolle fertig zugewiesen -> kein Zuweisen-Knopf mehr (Korrektur per langem Druck)
  if(st&&!(g.night===1&&(S.counts[st]||0)>assignedCount(st)))ms=ms.filter(m=>m!=='as:'+st);
  const chips=!ms.length||(st&&stepDone(st)===true)?'':!witchUI||curMode().startsWith('as:')?chipRow(ms):chipRow(ms).replace(/<div class="hint">[\s\S]*?<\/div>\s*$/,'');
  return shell(ann,`${body}${chips}`,nav(back+nextBtn,sleep),true);
}

function vDay(){
  const g=G();
  let body='';
  body+=winNote((g.today||[]).some(i=>g.p[i].cause==='vote')?'night':'day');
  if(g.angelWon&&g.night===1)body+=`<div class="alert good">😇 ${t('qAngel')}</div>`;
  const cur=curMode(),nm=needMayor();
  const deaths=g.today&&g.today.length?`<div class="sec">${t('deadToday')}</div><div class="vlist">${g.today.map(i=>deathRow(i,g.p[i].cause?t('c_'+g.p[i].cause):'')).join('')}</div>`:'';
  const nN=(g.today||[]).filter(i=>g.p[i].cause!=='vote').length;
  const morning=!g.today?[t('dawn')]:nN?[nN===1?t('dawnExcept1'):t('dawnExceptN',{a:nN})]:[t('dawnAgain'),t('nobodyDied')];
  // Runde 0: Morgen – Dorf wacht auf, wer ist gestorben
  if(inMorning()){
    const list=g.today.length?`<div class="vlist">${g.today.map(i=>deathRow(i,g.p[i].cause?t('c_'+g.p[i].cause):'')).join('')}</div>`:'';
    const ann=`<div class="phasebar day">☀️ ${esc(phaseLabel())}</div><div class="ann"><div class="ai">☀️</div>${sayBlock(morning)}</div>`;
    const notes=(g.nightNotes||[]).map(n=>`<div class="hint">${esc(t(n[0],{a:n[1]||''}))}</div>`).join('');
    return shell(ann,list+notes+body,nav(`<button class="nextb" data-a="morningOk">${t('next')} ›</button>`),true);
  }
  // Runde 1 des Tages: Bürgermeisterwahl (solange keiner lebt). Hier wird noch nicht eingeschlafen.
  if(nm){
    const ann=`<div class="ann"><div class="ai">${ico('mayor')}</div><div style="flex:1;min-width:0"><div class="sec" style="margin:0 0 6px">${t('mayorRound')}</div>${sayBlock([g.p.some(p=>p.wasMayor)?t('sayMayorDead'):t('sayMayor')])}</div></div>`;
    return shell(ann,body+`<div class="hint">${t('h_mayor')}</div>`,nav(`<button class="ghost" data-a="skipMayor">${t('skipMayor')}</button>`),true);
  }
  // Runde 2: Abstimmung des Dorfs. Verbannen ist Normalfall: nur Auswahl + ein roter Bestätigen-Knopf
  if(cur==='mayor')body+=`<div class="hint">${t('h_mayor')}</div>`;
  else if(g.cond!=null)body+=`<div class="alert">⚖️ ${esc(plabel(g.cond))}</div>
      <div class="row"><button class="back" data-a="uncond">${t('cancel')}</button><button class="nextb red" data-a="condemn">${t('condemn')}</button></div>`;
  else if(!(g.today||[]).some(i=>g.p[i].cause==='vote'))body+=`<div class="hint">${t('h_cond')}</div>`;
  body+=`<div class="chips"><button class="chip ${cur==='mayor'?'on':''}" data-a="mode" data-v="mayor" aria-pressed="${cur==='mayor'}">${ico('mayor')} ${t('m_mayor')}</button></div>`;
  const voted=(g.today||[]).some(i=>g.p[i].cause==='vote');
  // Morgen wurde schon auf eigener Seite angesagt (außer bei alten Spielständen ohne g.today)
  const ann=`<div class="ann"><div class="ai">⚖️</div>${sayBlock([...(g.today?[]:morning),voted?'':t('sayVote')])}</div>`;
  return shell(ann,body,nav(`<button class="nextb" data-a="nextNight">🌙 ${t('nextNight')}</button>`),true);
}

  heal:()=>{const g=G();if(!g.witch.heal)return toast(t('healUsed'));commit(t('L_heal'),()=>{g.nd.heal=!g.nd.heal})},
  peek:()=>{ui.peek=true;render()},
  condemn:condemn,uncond:()=>commit(t('L_pick'),()=>{G().cond=null}),
  q:d=>qAction(d.v),
  sAnchor:()=>{const i=ui.sheet.i;commit(t('L_anchor'),()=>{const p=G().p[i];p.anchor=!p.anchor})},
  sDead:()=>{const i=ui.sheet.i,p=G().p[i];
    if(p.dead)commit(t('L_revive'),()=>{p.dead=false;p.cause=null});
    else{ui.sheet=null;commit(t('L_dead'),()=>kill(i,'manual'))}},
  sMayor:()=>{const i=ui.sheet.i;commit(t('L_mayor'),()=>{const g=G(),was=g.p[i].mayor;g.p.forEach(x=>x.mayor=false);g.p[i].mayor=!was;if(g.p[i].mayor&&g.queue.length&&g.queue[0].k==='mayor')g.queue.shift()})},
  sCause:d=>{const i=ui.sheet.i;commit(t('L_cause'),()=>{G().p[i].cause=d.v})},
  sRole:d=>{const i=ui.sheet.i;if(G().p[i].role===d.v)return;if(roleFull(d.v))return toast(t('roleFull',{a:rn(d.v)}));commit(t('L_role'),()=>{G().p[i].role=d.v})}
};
function flushNote(){
  const inp=document.getElementById('noteIn');
  if(inp&&ui.sheet&&G()){const v=inp.value.trim(),p=G().p[ui.sheet.i];if(v!==p.note){p.note=v;save()}}
}
document.addEventListener('click',e=>{
  if(ui.lp){ui.lp=false;return}
  const seat=e.target.closest('.seat');
  if(seat&&ui.drag)return;
  if(seat&&!e.target.closest('#layer')){tapPlayer(+seat.dataset.i);return}
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.dataset.a==='closeLayer'&&el.classList.contains('layer')&&e.target!==el)return;
  if(el.disabled)return;
  if(el.dataset.a!=='closeLayer'&&el.dataset.a[0]==='s'&&el.dataset.a!=='settings'&&el.dataset.a!=='setLang')flushNote();
  const f=A[el.dataset.a];if(f)f(el.dataset);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(ui.sheet||ui.settings||ui.confirm)){closeLayer();return}
  if((e.key==='Enter'||e.key===' ')){
    const seat=e.target.closest&&e.target.closest('.seat');
    if(seat&&ui.drag)return;
    if(seat){e.preventDefault();tapPlayer(+seat.dataset.i);return}
    const rc=e.target.closest&&e.target.closest('.rcard[data-a]');
    if(rc){e.preventDefault();A.role(rc.dataset)}
  }
});
document.addEventListener('change',e=>{if(e.target.id==='ncount'){const v=parseInt(e.target.value,10);if(v===S.n)return;S.n=Math.max(5,Math.min(99,isNaN(v)?S.n:v));preset(S);save();render()}});
// long-press on a seat opens details in any mode
let lpTimer=null,lpStart=null;
document.addEventListener('pointerdown',e=>{
  const seat=e.target.closest('.seat');if(!seat)return;
  if(ui.drag){startDrag(e,+seat.dataset.i);return}
  lpStart=[e.clientX,e.clientY];ui.lp=false;
  lpTimer=setTimeout(()=>{ui.lp=true;openSheet(+seat.dataset.i);if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}},480);
});
const lpCancel=e=>{if(lpTimer&&(!lpStart||e.type!=='pointermove'||Math.hypot(e.clientX-lpStart[0],e.clientY-lpStart[1])>10)){clearTimeout(lpTimer);lpTimer=null}};
['pointerup','pointercancel','pointerleave','pointermove'].forEach(ev=>document.addEventListener(ev,lpCancel));
// Ziehen im Verschiebe-Modus
let dragI=null,dragRaf=0;
function startDrag(e,i){
  const g=G(),n=g.p.length,M=mapGeom(n);
  if(!g.seatPos||g.seatPos.length!==n)g.seatPos=seatPts(M,n).map(([x,y])=>[x/M.VW,y/M.VH]);
  dragI=i;e.preventDefault();
}
document.addEventListener('pointermove',e=>{
  if(dragI==null)return;e.preventDefault();
  const svg=document.querySelector('.mapwrap svg');if(!svg)return;
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const q=pt.matrixTransform(svg.getScreenCTM().inverse()),M=mapGeom(G().p.length);
  G().seatPos[dragI]=[q.x/M.VW,q.y/M.VH];
  if(!dragRaf)dragRaf=requestAnimationFrame(()=>{dragRaf=0;const s2=document.querySelector('.mapwrap svg');if(s2)s2.outerHTML=vMap()});
},{passive:false});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{if(dragI!=null){dragI=null;save()}}));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.seat'))e.preventDefault()});

let toastT=null;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600)}

function render(){
  const a=document.getElementById('app');
  a.innerHTML=S.screen==='lang'?vLang():S.screen==='resume'?vResume():S.screen==='count'?vCount():S.screen==='roles'?vRoles():vGame();
  document.documentElement.lang=S.lang;
  renderLayer();
  watchMap();
  keepAwake();
}
/* Oval an die tatsächlich freie Fläche anpassen (Panel ein-/ausgeklappt, Drehen, Schrift geladen) */
let mapRO=null;
function watchMap(){
  const mw=document.querySelector('.mapwrap');
  if(mapRO)mapRO.disconnect();
  if(!mw)return;
  if(!mapRO&&window.ResizeObserver)mapRO=new ResizeObserver(()=>fitMap());
  if(mapRO)mapRO.observe(mw);
  fitMap();
}
function fitMap(){
  const mw=document.querySelector('.mapwrap');if(!mw||!G())return;
  const w=Math.min(820,mw.clientWidth-8),h=mw.clientHeight-8;
  if(w<60||h<60)return;
  if(Math.abs(w-(ui.mw||0))<2&&Math.abs(h-(ui.mh||0))<2)return;
  ui.mw=w;ui.mh=h;
  const svg=mw.querySelector('svg');if(svg)svg.outerHTML=vMap();
}
window.addEventListener('resize',fitMap);
/* Bildschirm während des Spiels nicht abdunkeln lassen */
let wakeLk=null;
async function keepAwake(){
  if(S.screen!=='game'){if(wakeLk){try{wakeLk.release()}catch(_){}wakeLk=null}return}
  if(wakeLk||!('wakeLock' in navigator)||document.visibilityState!=='visible')return;
  try{wakeLk=await navigator.wakeLock.request('screen');wakeLk.addEventListener('release',()=>{wakeLk=null})}catch(_){wakeLk=null}
}
document.addEventListener('visibilitychange',keepAwake);
load();render();
</script>
<script>
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
</script>
